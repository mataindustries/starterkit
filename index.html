:root{
  --paper:#F3EEE6;--card:#FBF8F3;--ink:#171512;--ink2:#4A443D;--muted:#857C71;--line:rgba(23,21,18,.12);--line2:rgba(23,21,18,.22);
  --accent:#E2542B;--ok:#2F6B47;--bad:#B3261E;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Inter Display","Inter",system-ui,Roboto,Arial,sans-serif;
  --serif:"Lora",Georgia,"Noto Serif",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:30;background:rgba(243,238,230,.9);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;height:60px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--ink);position:relative;overflow:hidden;flex:none}
.brand i:after{content:"";position:absolute;left:5px;right:5px;top:13px;height:16px;border-radius:16px 16px 0 0;background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;font:600 13px/1 var(--sans);letter-spacing:.04em;padding:0 15px;min-height:44px;border-radius:999px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.banner{background:var(--ink);color:var(--paper);font-size:14px;padding:12px 20px;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.hero{padding:30px 0 10px}
.eyebrow{font:600 11.5px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font:600 clamp(34px,9.6vw,46px)/1.06 var(--serif);letter-spacing:-.02em;margin:0 0 14px}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lede{font-size:17px;line-height:1.5;color:var(--ink2);margin:0}
.fan{position:relative;height:min(64vw,300px);margin:22px 0 6px}
.fan canvas{position:absolute;top:6%;width:44%;height:auto;border-radius:8px;box-shadow:0 18px 30px -16px rgba(23,21,18,.45),0 0 0 1px rgba(23,21,18,.06)}
.fan canvas:nth-child(1){left:3%;transform:rotate(-7deg);z-index:1}
.fan canvas:nth-child(2){left:28%;top:0;transform:rotate(0deg);z-index:3}
.fan canvas:nth-child(3){left:53%;transform:rotate(7deg);z-index:2}
.fancap{font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px 6px;margin:0 0 14px}
.step{display:flex;align-items:baseline;gap:12px;margin:0 0 18px;font:600 21px/1.2 var(--serif);letter-spacing:-.01em}
.step span{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--accent);transform:translateY(-3px)}
.step em{font:400 13px/1 var(--sans);color:var(--muted);font-style:normal;margin-left:auto}
.field{display:block;margin:0 0 18px}
.field>span,.lbl{display:block;font:600 13.5px/1.3 var(--sans);margin:0 0 8px}
input[type=text],input[type=tel],input[type=email],input[type=url],textarea{width:100%;font:400 17px/1.35 var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;min-height:52px;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:92px;line-height:1.45}
input::placeholder,textarea::placeholder{color:#A39A8F}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(23,21,18,.07)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:0 16px;min-height:46px;font:500 15px/1 var(--sans)}
.chip[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#f_other{margin-top:10px}
.hint{font-size:14px;line-height:1.45;color:var(--muted);margin:-4px 0 18px}
.rowend{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-10px 0 16px}
.rowend .hint{margin:0;font-size:13px}
.err{color:var(--bad);font-size:14px;font-weight:500;margin:-10px 0 16px}
.link{background:none;border:0;padding:6px 0;min-height:44px;font:600 14px/1 var(--sans);color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;font:600 16px/1 var(--sans);padding:0 22px;min-height:54px;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.big{width:100%;min-height:62px;font-size:18px}
.btn.sm{min-height:44px;font-size:14px;padding:0 18px}
.upload{display:flex;flex-direction:column;gap:14px;margin:0 0 16px}
.imgbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.imgbox img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff}
.dock{position:sticky;bottom:0;z-index:5;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(243,238,230,0),var(--paper) 28%)}
.privacy{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:2px 0 0}
.kithead{padding:14px 0 0}
.kittitle{font:600 30px/1.1 var(--serif);letter-spacing:-.015em;margin:8px 0 4px;overflow-wrap:anywhere}
.kitsub{color:var(--muted);font-size:14px;margin:0 0 14px}
.tabs{position:sticky;top:60px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0;background:var(--paper)}
.tab{border:1px solid var(--line2);background:var(--card);border-radius:12px;min-height:48px;padding:0 4px;font:600 13.5px/1.1 var(--sans);color:var(--ink2)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.panel{padding:12px 0 30px}
.warn{background:#fff;border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2);margin:0 0 18px}
.ctl{margin:0 0 20px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl{border:0;background:none;padding:0;text-align:left}
.tpl canvas{display:block;width:100%;height:auto;border-radius:9px;outline:2px solid transparent;outline-offset:3px;box-shadow:0 0 0 1px var(--line)}
.tpl[aria-pressed=true] canvas{outline-color:var(--ink)}
.tpl span{display:block;font:600 12.5px/1 var(--sans);padding:10px 2px 0;color:var(--ink2)}
.tpl[aria-pressed=true] span{color:var(--ink)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:48px;height:48px;border-radius:50%;border:2px solid transparent;padding:3px;background:none}
.sw button i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw button[aria-pressed=true]{border-color:var(--ink)}
.preview{margin:26px 0 14px}
.preview canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 20px 40px -22px rgba(23,21,18,.5),0 0 0 1px var(--line)}
.preview.story canvas{width:64%;margin:0 auto}
figcaption{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 30px}
.actions.solo{grid-template-columns:1fr}
.out{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin:0 0 12px}
.out .meta{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.out h3{font:600 20px/1.25 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.out .txt{white-space:pre-wrap;margin:0 0 14px;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.out .sub{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.out dl{margin:0 0 12px}
.out dt{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.out dd{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink2)}
.capbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.capbox .txt{margin:0}
mark{background:rgba(226,84,43,.14);color:inherit;border-radius:4px;padding:0 2px}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.pers{padding-bottom:4px}
.pers h3{font:600 18px/1.2 var(--serif);margin:0 0 6px}
.foot{border-top:1px solid var(--line);margin-top:20px}
.foot .in{max-width:560px;margin:0 auto;padding:22px 20px calc(30px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted);text-align:center}
.foot p{margin:0 0 6px}
.foot .made{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.foot .link{font-size:13px;color:var(--muted);min-height:44px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:999px;font:500 14px/1.3 var(--sans);transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#selftest{position:fixed;inset:0;z-index:80;background:var(--paper);overflow:auto;padding:24px 20px 40px}
#selftest h2{font:600 26px/1.15 var(--serif);margin:0 0 6px}
#selftest ol{padding:0;list-style:none;margin:18px 0}
#selftest li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;font-size:14px}
#selftest li b{display:inline-block;width:22px}
#selftest .pass b{color:var(--ok)} #selftest .fail b{color:var(--bad)}
#selftest small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.fb{margin:-20px 0 30px;text-align:center}
.fb .link{font-size:13px;color:var(--ink2)}
.ba{padding-bottom:16px}
.ba h3{font:600 20px/1.2 var(--serif);margin:0 0 6px}
.bapick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 4px}
.bapick .btn{width:100%;padding:0 10px}
.bapick .btn[data-has=true]{background:var(--ink);color:var(--paper)}
.ba .preview{margin-top:18px}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(15,13,11,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
#viewer p{color:#F3EEE6;font-size:15px;text-align:center;margin:0;max-width:340px}
#viewer img{max-width:100%;max-height:68vh;border-radius:8px;-webkit-touch-callout:default;user-select:auto}
#viewer .btn{border-color:#F3EEE6;color:#F3EEE6;min-width:160px}
@media (max-width:350px){.tab{font-size:12px;letter-spacing:-.01em;white-space:nowrap}.tabs{gap:4px}.wrap{padding:0 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<header class="top"><div class="in">
  <div class="brand"><i aria-hidden="true"></i><span data-i="appName">Starter Kit</span></div>
  <div class="seg" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
</div></header>
<div id="inapp" class="banner" hidden data-i="inapp"></div>

<main class="wrap">
<section id="setup">
  <div class="hero">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 data-ih="h1"></h1>
    <p class="lede" data-i="lede"></p>
    <div class="fan" aria-hidden="true"><canvas width="216" height="270"></canvas><canvas width="216" height="270"></canvas><canvas width="216" height="270"></canvas></div>
    <p class="fancap" data-i="examples"></p>
  </div>

  <section class="card">
    <h2 class="step"><span>01</span><b data-i="s1"></b></h2>
    <label class="field"><span data-i="l_name"></span><input id="f_name" type="text" maxlength="60" autocomplete="off" data-ph="ph_name" enterkeyhint="next"></label>
    <p class="err" id="e_name" hidden data-i="needName"></p>
    <div class="field"><span class="lbl" id="lbl_service" data-i="l_service"></span>
      <div class="chips" id="chips" role="radiogroup" aria-labelledby="lbl_service"></div>
      <input id="f_other" type="text" maxlength="40" data-ph="ph_other" hidden autocomplete="off" aria-labelledby="lbl_service">
    </div>
    <p class="err" id="e_other" hidden data-i="needOther"></p>
    <label class="field"><span data-i="l_area"></span><input id="f_area" type="text" maxlength="60" data-ph="ph_area" autocomplete="off"></label>
    <label class="field"><span data-i="l_desc"></span><textarea id="f_desc" rows="3" maxlength="220"></textarea></label>
    <div class="rowend"><p class="hint" data-i="descHint"></p><button type="button" class="link" id="b_suggest" data-i="suggest"></button></div>
  </section>

  <section class="card">
    <h2 class="step"><span>02</span><b data-i="s2"></b><em data-i="optional"></em></h2>
    <p class="hint" data-i="contactHint"></p>
    <label class="field"><span data-i="l_phone"></span><input id="f_phone" type="tel" inputmode="tel" maxlength="24" autocomplete="off"></label>
    <label class="field"><span data-i="l_handle"></span><input id="f_handle" type="text" maxlength="60" data-ph="ph_handle" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span data-i="l_web"></span><input id="f_web" type="url" inputmode="url" maxlength="60" data-ph="ph_web" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span data-i="l_email"></span><input id="f_email" type="email" inputmode="email" maxlength="60" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
  </section>

  <section class="card">
    <h2 class="step"><span>03</span><b data-i="s3"></b><em data-i="optional"></em></h2>
    <div class="upload">
      <label class="btn" for="f_file"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span id="uplabel" data-i="l_upload"></span></label>
      <input id="f_file" type="file" accept="image/*" class="vh" tabindex="-1">
      <label class="btn" for="f_camera"><span data-i="l_capture"></span></label>
      <input id="f_camera" type="file" accept="image/*" capture="environment" class="vh" tabindex="-1">
      <div id="imgbox" class="imgbox" hidden>
        <img id="imgprev" alt="">
        <div class="seg" id="kindseg" role="group"><button type="button" data-kind="logo" data-i="k_logo"></button><button type="button" data-kind="photo" data-i="k_photo"></button></div>
        <button type="button" class="link" id="b_rmimg" data-i="remove"></button>
      </div>
    </div>
    <p class="hint" data-i="imgHint"></p>
  </section>

  <div class="dock">
    <button type="button" class="btn primary big" id="b_go"><span data-i="go"></span><span aria-hidden="true">→</span></button>
    <p class="privacy"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span data-i="privacy"></span></p>
  </div>
</section>

<section id="kit" hidden>
  <div class="kithead"><button type="button" class="link" id="b_back">← <span data-i="back"></span></button></div>
  <h2 class="kittitle" id="kitTitle"></h2>
  <p class="kitsub" id="kitSub"></p>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="g" aria-selected="true" data-i="t_g"></button>
    <button type="button" class="tab" role="tab" data-tab="b" aria-selected="false" data-i="t_b"></button>
    <button type="button" class="tab" role="tab" data-tab="m" aria-selected="false" data-i="t_m"></button>
    <button type="button" class="tab" role="tab" data-tab="w" aria-selected="false" data-i="t_w"></button>
  </div>

  <div class="panel" id="p_g" role="tabpanel">
    <p class="warn" id="noContact" hidden data-i="noContact"></p>
    <div class="ctl"><span class="lbl" data-i="style"></span><div class="tpls" id="tpls"></div></div>
    <div class="ctl"><span class="lbl" data-i="colors"></span><div class="sw" id="sw"></div></div>
    <label class="field"><span data-i="l_head"></span><textarea id="f_head" rows="2" maxlength="90"></textarea></label>
    <div class="rowend"><span></span><button type="button" class="link" id="b_head">↻ <span data-i="another"></span></button></div>
    <label class="field"><span data-i="l_cta"></span><input id="f_cta" type="text" maxlength="40" autocomplete="off"></label>
    <div class="rowend"><span></span><button type="button" class="link" id="b_cta">↻ <span data-i="another"></span></button></div>

    <figure class="preview"><canvas id="c_post" width="1080" height="1350" role="img"></canvas><figcaption data-i="cap_post"></figcaption></figure>
    <div class="actions"><button type="button" class="btn primary" data-save="post" data-i="save"></button><button type="button" class="btn" data-share="post" data-i="share"></button></div>
    <p class="fb"><button type="button" class="link" data-open="post" data-i="openImg"></button></p>
    <figure class="preview story"><canvas id="c_story" width="1080" height="1920" role="img"></canvas><figcaption data-i="cap_story"></figcaption></figure>
    <div class="actions"><button type="button" class="btn primary" data-save="story" data-i="save"></button><button type="button" class="btn" data-share="story" data-i="share"></button></div>
    <p class="fb"><button type="button" class="link" data-open="story" data-i="openImg"></button></p>
    <section class="card ba" id="ba">
      <h3 data-i="baT"></h3>
      <p class="hint" data-i="baHint"></p>
      <div class="bapick">
        <label class="btn sm" for="f_before" id="l_before"><span data-i="baBefore"></span></label><input id="f_before" type="file" accept="image/*" class="vh" tabindex="-1">
        <label class="btn sm" for="f_after" id="l_after"><span data-i="baAfter"></span></label><input id="f_after" type="file" accept="image/*" class="vh" tabindex="-1">
      </div>
      <figure class="preview"><canvas id="c_ba" width="1080" height="1350" role="img"></canvas><figcaption data-i="cap_ba"></figcaption></figure>
      <div class="actions"><button type="button" class="btn primary" data-save="ba" data-i="save"></button><button type="button" class="btn" data-share="ba" data-i="share"></button></div>
      <p class="fb" style="margin-bottom:0"><button type="button" class="link" data-open="ba" data-i="openImg"></button></p>
    </section>
  </div>

  <div class="panel" id="p_b" role="tabpanel" hidden><div id="out_b"></div></div>

  <div class="panel" id="p_m" role="tabpanel" hidden>
    <section class="card pers">
      <h3 data-i="persT"></h3>
      <p class="hint" data-i="persHint"></p>
      <label class="field"><span data-i="l_owner"></span><input id="f_owner" type="text" maxlength="30" autocomplete="off"></label>
      <label class="field"><span data-i="l_customer"></span><input id="f_customer" type="text" maxlength="30" autocomplete="off"></label>
      <label class="field"><span data-i="l_review"></span><input id="f_review" type="url" inputmode="url" maxlength="200" data-ph="ph_review" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    </section>
    <div id="out_m"></div>
  </div>

  <div class="panel" id="p_w" role="tabpanel" hidden><p class="hint" data-i="weekIntro" style="margin:0 0 14px;font-size:15px"></p><div id="out_w"></div></div>
</section>
</main>

<footer class="foot"><div class="in">
  <p class="made" data-i="made"></p>
  <p><span data-i="local"></span></p>
  <p><button type="button" class="link" id="b_clear" data-i="clear"></button></p>
</div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewhint"><p id="viewhint" data-i="holdHint"></p><img id="viewimg" alt=""><button type="button" class="btn" id="b_closeview" data-i="close"></button></div>
<section id="selftest" hidden></section>

 {en:"Terracotta",es:"Terracota",paper:"#F4EEE4",ink:"#1C1813",accent:"#EE6A3B"},
 {en:"Pine & lime",es:"Pino y lima",paper:"#EEF0E5",ink:"#13291F",accent:"#C5E36B"},

const PAL_DEFAULT={cleaning:2,landscaping:1,detailing:3,pressure:2,handyman:0,other:0};
const ALLDESC=new Set();ORDER.forEach(k=>["en","es"].forEach(l=>{if(SV[k][l].desc)ALLDESC.add(SV[k][l].desc)}));

const clean=s=>String(s==null?"":s).replace(/\s+/g," ").trim();
const capFirst=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const endP=s=>/[.!?…]$/.test(s)?s:s+".";
function formatPhone(s){s=clean(s);const g=s.replace(/\D/g,"");
  if(g.length===10)return`(${g.slice(0,3)}) ${g.slice(3,6)}-${g.slice(6)}`;
  if(g.length===11&&g[0]==="1")return`(${g.slice(1,4)}) ${g.slice(4,7)}-${g.slice(7)}`;return s}
function normHandle(s){s=clean(s);if(!s)return"";if(/\s/.test(s))return s;
  s=s.replace(/^https?:\/\//i,"").replace(/^(www\.|m\.)?(instagram|facebook|fb|tiktok)\.com\//i,"").replace(/[/?#].*$/,"").replace(/^@+/,"");return s?"@"+s:""}
const normWeb=s=>clean(s).replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/\/+$/,"");
const STOP=/^(the|la|el|los|las|de|del|and|y|&|llc|inc\.?|co\.?|services?|servicios?)$/i;
function initials(name){const w=clean(name).split(" ").filter(x=>/[\p{L}\p{N}]/u.test(x));let k=w.filter(x=>!STOP.test(x));if(!k.length)k=w;
  return k.slice(0,2).map(x=>(x.match(/[\p{L}\p{N}]/u)||[""])[0].toUpperCase()).join("")||"•"}
function lowerFirst(s){return/^[A-ZÁÉÍÓÚÑ][a-záéíóúñü]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s}
function contacts(d){return[d.phone,d.handle,d.web,d.email].filter(Boolean)}

/* Turns the raw form state into everything the graphics and copy need. */
function deriveData(s,img){
  const L=s.lang==="es"?"es":"en",svc=SV[s.service]?s.service:"cleaning",S=SV[svc][L],other=clean(s.other);
  const label=svc==="other"?(capFirst(other)||(L==="es"?"Servicios locales":"Local services")):S.label;
  const noun=svc==="other"?(other?lowerFirst(other):(L==="es"?"servicios locales":"local services")):S.noun;
  const sub=t=>t.replace(/\{S\}/g,capFirst(noun)).replace(/\{s\}/g,noun);
  const hls=S.hl.map(sub),ctas=CTAS[L];
  const ownHead=String(s.headline||"").split("\n").map(clean).filter(Boolean).join("\n");
  const pi=s.pal>=0&&s.pal<PALS.length?s.pal:PAL_DEFAULT[svc];
  return{lang:L,service:svc,name:clean(s.name)||UI[L].yourBiz,label,noun,area:clean(s.area),
    desc:clean(s.desc)||sub(S.desc),headline:s.hlEdited&&ownHead?ownHead:hls[(s.hlIdx||0)%hls.length],
    cta:s.ctaEdited&&clean(s.cta)?clean(s.cta):ctas[(s.ctaIdx||0)%ctas.length],hls,ctas,
    phone:formatPhone(s.phone),handle:normHandle(s.handle),web:normWeb(s.web),email:clean(s.email),
    owner:clean(s.owner),customer:clean(s.customer),review:clean(s.review),initials:initials(s.name||label),
    pal:PALS[pi],palIdx:pi,img:img||null,kind:s.kind==="logo"?"logo":"photo",
    x:{job:sub(S.job),tip:sub(S.tip),tools:sub(S.tools),faq:sub(S.faq),quote:sub(S.quote),prep:sub(S.prep)}};
}
function shortLine(t,max){t=clean(t);if(!t)return"";const s=t.split(/(?<=[.!?])\s/)[0].replace(/[.!?]+$/,"");if(s.length<=max)return s;
  const c=s.slice(0,max),i=Math.max(c.lastIndexOf(" — "),c.lastIndexOf(": "));if(i>30)return c.slice(0,i);const j=c.lastIndexOf(", ");return j>30?c.slice(0,j):""}
function trimTo(s,n){if(s.length<=n)return s;const c=s.slice(0,n-1);return c.slice(0,Math.max(c.lastIndexOf(" "),20)).replace(/[\s,.;:·—–-]+$/,"")+"…"}
